name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  busted:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # WoW's interpreter is Lua 5.1-based — test on the same version.
      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1.5"

      - uses: leafo/gh-actions-luarocks@v4

      - name: Install busted
        run: luarocks install busted

      # Spec roots come from .busted at the repo root. The specs stub a
      # pure-Lua `bit` library, so no luabitop rock is needed.
      - name: Run unit tests
        run: busted --output=utfTerminal

  luacheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1.5"

      - uses: leafo/gh-actions-luarocks@v4

      - name: Install luacheck
        run: luarocks install luacheck

      - name: Run luacheck
        run: luacheck . --codes
